<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-label="Quy trình tính SQLite execution accuracy">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="500.0" y="39" font-size="25" fill="#172033" text-anchor="middle" font-weight="bold">Quy trình tính SQLite execution accuracy</text><rect x="130" y="75" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="105" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Prediction SQL + gold SQL + database tương ứng</text><text x="500" y="132" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Gold không được dùng làm đáp án đầu vào cho mô hình</text><path d="M500,153 V180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="187" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="232" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Thực thi hai truy vấn bằng SQLite read-only</text><path d="M500,265 V292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="299" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="329" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Kiểm tra số cột và so sánh kết quả</text><text x="500" y="356" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Giữ dòng trùng; cho phép hoán vị cột nhất quán</text><path d="M500,377 V404" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="411" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="441" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Gold có ORDER BY ngoài cùng → xét thứ tự dòng</text><text x="500" y="468" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Prediction rỗng hoặc lỗi thực thi → tính sai</text><path d="M500,489 V516" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="523" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="553" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">EX = số câu khớp kết quả / tổng số câu</text><text x="500" y="580" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Một database mỗi câu; không phải Test Suite Accuracy</text></g></svg>