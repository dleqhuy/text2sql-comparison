<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="747" viewBox="0 0 1000 747" role="img" aria-label="Luồng thực nghiệm Text-to-SQL">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="500.0" y="39" font-size="25" fill="#172033" text-anchor="middle" font-weight="bold">Luồng thực nghiệm Text-to-SQL</text><rect x="130" y="75" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="105" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Spider dev: câu hỏi + db_id + schema/database</text><text x="500" y="132" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">1.034 câu • 20 database • cùng ID và thứ tự</text><path d="M500,153 V180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="187" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="232" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Chuẩn bị input chung và giữ gold cho bước đánh giá</text><path d="M500,265 V292" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="299" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="329" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">DIN-SQL | MAC-SQL | DAIL-SQL | Codex MCP SQL</text><text x="500" y="356" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Mỗi hệ thống sinh SQL theo cơ chế riêng</text><path d="M500,377 V404" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="411" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="456" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Lưu raw/trace → chuẩn hóa prediction SQL</text><path d="M500,489 V516" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="523" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="553" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Chạy prediction và gold trên cùng database SQLite</text><text x="500" y="580" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">So sánh kết quả bằng evaluator chung</text><path d="M500,601 V628" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="635" width="740" height="78" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="500" y="680" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Tổng hợp EX toàn tập và theo bốn mức độ khó</text></g></svg>