[project]
name = "text2sql-comparison"
version = "0.1.0"
description = "Spider dev comparison of DIN-SQL, MAC-SQL, DAIL-SQL and Codex MCP SQL"
requires-python = ">=3.9"
dependencies = ["nltk>=3.8,<4"]

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.ruff]
target-version = "py39"
line-length = 88
include = ["*.py", "*.pyi"]
extend-exclude = ["data", "downloads", "results"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
